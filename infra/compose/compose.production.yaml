name: sponge-production

x-sponge-environment: &sponge-environment
  SPONGE_ENVIRONMENT: production
  SPONGE_DATABASE_URL: postgresql+psycopg://sponge:${SPONGE_DB_PASSWORD:?Set SPONGE_DB_PASSWORD}@postgres:5432/sponge
  SPONGE_REDIS_URL: redis://redis:6379/0
  SPONGE_STORAGE_ROOT: /app/data/local
  SPONGE_WEB_DIST: /app/dist
  SPONGE_ALLOWED_ORIGINS: ${SPONGE_ALLOWED_ORIGINS:-}
  SPONGE_TRUSTED_HOSTS: ${SPONGE_TRUSTED_HOSTS:-localhost,127.0.0.1}
  SPONGE_SESSION_LIMIT_PER_HOUR: ${SPONGE_SESSION_LIMIT_PER_HOUR:-120}
  SPONGE_SESSION_TTL_HOURS: ${SPONGE_SESSION_TTL_HOURS:-168}
  SPONGE_TRUSTED_PROXY_CIDRS: ${SPONGE_TRUSTED_PROXY_CIDRS:-}

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: sponge
      POSTGRES_PASSWORD: ${SPONGE_DB_PASSWORD:?Set SPONGE_DB_PASSWORD}
      POSTGRES_DB: sponge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sponge -d sponge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment: *sponge-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - sponge-data:/app/data/local

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *sponge-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SPONGE_PUBLIC_PORT:-8080}:8080"
    volumes:
      - sponge-data:/app/data/local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *sponge-environment
    command: ["python", "-m", "scripts.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - sponge-data:/app/data/local
    stop_grace_period: 45s

  maintenance:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *sponge-environment
    command: ["python", "-m", "scripts.maintenance"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - sponge-data:/app/data/local
    stop_grace_period: 30s

volumes:
  pgdata:
  redisdata:
  sponge-data:
