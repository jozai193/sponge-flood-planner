name: sponge
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: sponge
      POSTGRES_PASSWORD: ${SPONGE_DB_PASSWORD:-sponge_local}
      POSTGRES_DB: sponge
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sponge -d sponge"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
  redisdata:
